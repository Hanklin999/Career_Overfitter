name: Weekly 104 Full Detail Pipeline

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Pages per keyword"
        required: true
        default: "5"

      past_days:
        description: "Only crawl jobs posted within N days"
        required: true
        default: "30"

      run_detail:
        description: "Set true to crawl detail API"
        required: true
        default: "true"

      detail_limit:
        description: "Max detail rows per chunk. 0 means unlimited."
        required: true
        default: "0"

      truncate_before_run:
        description: "\u26a0\ufe0f 勾選後，爬蟲開始前會先清空 jd_raw + job_posting 全部資料（不可復原）"
        required: true
        default: false
        type: boolean

jobs:
  clear-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clear existing Supabase data (only if requested)
        if: ${{ github.event.inputs.truncate_before_run == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python clear_supabase_data.py

  scrape-104:
    needs: clear-data
    if: always() && needs.clear-data.result == 'success'
    runs-on: ubuntu-latest

    # Phase 1 scope (2026-07, updated same month): Job_taxonomy_forsearch.csv
    # is intentionally kept small so a single shard covers it. Originally cut
    # down from 147 keywords / 8 shards because the full-scope crawl was
    # getting blocked by 104 too often (see FAKE_404_THRESHOLD handling in
    # scraper_104.py). Current scope (12 keywords) is centered on
    # "Product Data Analyst" (Product Management + Analytics / Data / BI).
    # Previous Marketing/Brand/Growth + Analytics/Data/BI scope is preserved
    # in Job_taxonomy_forsearch_marketing_analytics_backup.csv.
    #
    # To re-expand or re-focus scope later:
    #   1. Copy categories/keywords from Job_taxonomy_forsearch_full.csv (or
    #      one of the *_backup.csv snapshots) back into
    #      Job_taxonomy_forsearch.csv (validate the crawler stays healthy on
    #      the current scope first).
    #   2. Add matrix entries below in the same offset/limit/end shape,
    #      keeping each shard at roughly 15-20 keywords.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - offset: 0
            limit: 20
            end: 12

    name: Scrape 104 keywords ${{ matrix.offset }}-${{ matrix.end }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '5' }}
          PAST_DAYS: ${{ github.event.inputs.past_days || '30' }}
          RUN_DETAIL: ${{ github.event.inputs.run_detail || 'true' }}
          DETAIL_LIMIT: ${{ github.event.inputs.detail_limit || '0' }}
        run: |
          CMD="python scraper_104.py \
            --keyword-offset ${{ matrix.offset }} \
            --keyword-limit ${{ matrix.limit }} \
            --max-pages ${{ env.MAX_PAGES }} \
            --past-days ${{ env.PAST_DAYS }} \
            --include-all-companies \
            --detail-limit ${{ env.DETAIL_LIMIT }}"

          if [ "${{ env.RUN_DETAIL }}" != "true" ]; then
            CMD="$CMD --skip-detail"
          fi

          echo "$CMD"
          eval "$CMD"

  cleaner:
    runs-on: ubuntu-latest
    needs: scrape-104
    if: always() && needs.scrape-104.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cleaner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python cleaner.py

      # RAG 用：幫這次清洗出來的新職缺（embedding 欄位還是 NULL 的）算 embedding。
      # 前提是已經在 Supabase 手動跑過 sql/001_enable_pgvector_rag.sql，
      # job_posting 才會有 embedding 這個欄位；沒跑過的話這步會直接失敗，
      # 但用 continue-on-error 讓它不影響前面爬蟲 + 清洗的結果算成功。
      - name: Backfill embeddings for RAG retrieval
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python backfill_embeddings.py --limit 200
