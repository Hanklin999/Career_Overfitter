name: Weekly 104 Full Detail Pipeline

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Pages per keyword"
        required: true
        default: "5"

      past_days:
        description: "Only crawl jobs posted within N days"
        required: true
        default: "30"

      run_detail:
        description: "Set true to crawl detail API"
        required: true
        default: "true"

      detail_limit:
        description: "Max detail rows per chunk. 0 means unlimited."
        required: true
        default: "0"

      truncate_before_run:
        description: "\u26a0\ufe0f 勾選後，爬蟲開始前會先清空 jd_raw + job_posting 全部資料（不可復原）"
        required: true
        default: false
        type: boolean

      embedding_limit:
        description: "這次最多幫幾筆補 embedding（原本寫死 200，改成可調；想清 backlog 就設大一點）"
        required: true
        default: "200"

jobs:
  clear-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clear existing Supabase data (only if requested)
        if: ${{ github.event.inputs.truncate_before_run == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python clear_supabase_data.py

  scrape-104:
    needs: clear-data
    if: always() && needs.clear-data.result == 'success'
    runs-on: ubuntu-latest

    # Phase 2 scope (2026-07): Job_taxonomy_forsearch.csv expanded from the
    # Product Data Analyst-only scope (12 keywords) to also cover Business
    # Analytics, Marketing Analytics, and Operations Analytics (42 keywords
    # total), so the Analytics Career Map has real market data across all
    # four domains instead of just Product. Originally cut down from 147
    # keywords / 8 shards because the full-scope crawl was getting blocked by
    # 104 too often (see FAKE_404_THRESHOLD handling in scraper_104.py); the
    # Product-only 12-keyword / 1-shard scope ran cleanly, so this expansion
    # keeps each shard at ~14 keywords (slightly larger than the old
    # 15-20/shard guidance, traded for fewer shards) rather than reverting to
    # the original 8-shard/147-keyword setup. Watch the scrape-104 job logs
    # for FAKE_404 warnings after this change; if blocking recurs, split each
    # shard further (e.g. 6 shards of ~7) rather than reducing keyword count.
    #
    # Prior scope snapshots are preserved for reference/rollback:
    #   - Job_taxonomy_forsearch_marketing_analytics_backup.csv (18 keywords,
    #     Marketing/Brand/Growth + Analytics/Data/BI)
    #   - Job_taxonomy_forsearch_full.csv (full 147-keyword/18-category set)
    #
    # To re-expand or re-focus scope further:
    #   1. Add/replace keywords in Job_taxonomy_forsearch.csv.
    #   2. Add matrix entries below in the same offset/limit/end shape,
    #      keeping each shard at roughly 14-20 keywords.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - offset: 0
            limit: 14
            end: 14
          - offset: 14
            limit: 14
            end: 28
          - offset: 28
            limit: 14
            end: 42

    name: Scrape 104 keywords ${{ matrix.offset }}-${{ matrix.end }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '5' }}
          PAST_DAYS: ${{ github.event.inputs.past_days || '30' }}
          RUN_DETAIL: ${{ github.event.inputs.run_detail || 'true' }}
          DETAIL_LIMIT: ${{ github.event.inputs.detail_limit || '0' }}
        run: |
          CMD="python scraper_104.py \
            --keyword-offset ${{ matrix.offset }} \
            --keyword-limit ${{ matrix.limit }} \
            --max-pages ${{ env.MAX_PAGES }} \
            --past-days ${{ env.PAST_DAYS }} \
            --include-all-companies \
            --detail-limit ${{ env.DETAIL_LIMIT }}"

          if [ "${{ env.RUN_DETAIL }}" != "true" ]; then
            CMD="$CMD --skip-detail"
          fi

          echo "$CMD"
          eval "$CMD"

  cleaner:
    runs-on: ubuntu-latest
    needs: scrape-104
    if: always() && needs.scrape-104.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cleaner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # --limit 沒帶的話預設只吃 jd_raw 裡最新 500 筆，past_days 一直往前推，
        # 舊資料只要被擠出這個窗口就永遠沒機會清洗（backlog 會一直卡住不會自己好）。
        # 這裡固定給大 limit + --only-new，確保每次排程都會把 jd_raw 全部掃過一輪，
        # 只處理還沒進 job_posting 的部分，不會每次都整張表重算一次。
        run: python cleaner.py --limit 20000 --only-new

      # RAG 用：幫這次清洗出來的新職缺（embedding 欄位還是 NULL 的）算 embedding。
      # 前提是已經在 Supabase 手動跑過 sql/001_enable_pgvector_rag.sql，
      # job_posting 才會有 embedding 這個欄位；沒跑過的話這步會直接失敗，
      # 但用 continue-on-error 讓它不影響前面爬蟲 + 清洗的結果算成功。
      - name: Backfill embeddings for RAG retrieval
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python backfill_embeddings.py --limit ${{ github.event.inputs.embedding_limit }}
