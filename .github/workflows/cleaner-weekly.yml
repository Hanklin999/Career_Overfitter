name: Weekly 104 Full Detail Pipeline

on:
  # GitHub Actions cron uses UTC.
  # Monday 23:00 Asia/Taipei = Monday 15:00 UTC.
  schedule:
    - cron: "0 15 * * 1"

  workflow_dispatch:
    inputs:
      max_pages:
        description: "Pages per keyword"
        required: true
        default: "5"

      past_days:
        description: "Only crawl jobs posted within N days"
        required: true
        default: "30"

      run_detail:
        description: "Set true to crawl detail API"
        required: true
        default: "true"

      detail_limit:
        description: "Max detail rows per chunk. 0 means unlimited."
        required: true
        default: "0"

jobs:
  scrape-104:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - offset: 0
            limit: 5
            end: 5
          - offset: 5
            limit: 5
            end: 10
          - offset: 10
            limit: 5
            end: 15
          - offset: 15
            limit: 5
            end: 20
          - offset: 20
            limit: 5
            end: 25
          - offset: 25
            limit: 5
            end: 30
          - offset: 30
            limit: 5
            end: 35
          - offset: 35
            limit: 5
            end: 40
          - offset: 40
            limit: 5
            end: 45
          - offset: 45
            limit: 5
            end: 50
          - offset: 50
            limit: 5
            end: 55
          - offset: 55
            limit: 5
            end: 60
          - offset: 60
            limit: 5
            end: 65
          - offset: 65
            limit: 5
            end: 70
          - offset: 70
            limit: 5
            end: 75
          - offset: 75
            limit: 5
            end: 80
          - offset: 80
            limit: 5
            end: 85
          - offset: 85
            limit: 5
            end: 90
          - offset: 90
            limit: 5
            end: 95
          - offset: 95
            limit: 5
            end: 100
          - offset: 100
            limit: 5
            end: 105
          - offset: 105
            limit: 5
            end: 110
          - offset: 110
            limit: 5
            end: 115
          - offset: 115
            limit: 5
            end: 120
          - offset: 120
            limit: 5
            end: 125
          - offset: 125
            limit: 5
            end: 130
          - offset: 130
            limit: 5
            end: 135
          - offset: 135
            limit: 5
            end: 140
          - offset: 140
            limit: 5
            end: 145
          - offset: 145
            limit: 5
            end: 150
          - offset: 150
            limit: 5
            end: 155
          - offset: 155
            limit: 5
            end: 160
          - offset: 160
            limit: 5
            end: 165
          - offset: 165
            limit: 5
            end: 170
          - offset: 170
            limit: 5
            end: 175
          - offset: 175
            limit: 5
            end: 180
          - offset: 180
            limit: 5
            end: 185
          - offset: 185
            limit: 5
            end: 190
          - offset: 190
            limit: 5
            end: 195
          - offset: 195
            limit: 5
            end: 200
          - offset: 200
            limit: 5
            end: 205
          - offset: 205
            limit: 5
            end: 210
          - offset: 210
            limit: 5
            end: 215
          - offset: 215
            limit: 5
            end: 220
          - offset: 220
            limit: 5
            end: 225
          - offset: 225
            limit: 5
            end: 230
          - offset: 230
            limit: 5
            end: 235
          - offset: 235
            limit: 5
            end: 240
          - offset: 240
            limit: 5
            end: 245
          - offset: 245
            limit: 5
            end: 250
          - offset: 250
            limit: 5
            end: 255
          - offset: 255
            limit: 5
            end: 260
          - offset: 260
            limit: 5
            end: 265

    name: Scrape 104 keywords ${{ matrix.offset }}-${{ matrix.end }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '5' }}
          PAST_DAYS: ${{ github.event.inputs.past_days || '30' }}
          RUN_DETAIL: ${{ github.event.inputs.run_detail || 'true' }}
          DETAIL_LIMIT: ${{ github.event.inputs.detail_limit || '0' }}
        run: |
          CMD="python scraper_104.py \
            --keyword-offset ${{ matrix.offset }} \
            --keyword-limit ${{ matrix.limit }} \
            --max-pages ${{ env.MAX_PAGES }} \
            --past-days ${{ env.PAST_DAYS }} \
            --include-all-companies"

          if [ "${{ env.RUN_DETAIL }}" != "true" ]; then
            CMD="$CMD --skip-detail"
          fi

          CMD="$CMD --detail-limit ${{ env.DETAIL_LIMIT }}"

          echo "$CMD"
          eval "$CMD"

  cleaner:
    runs-on: ubuntu-latest
    needs: scrape-104
    if: always() && needs.scrape-104.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cleaner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python cleaner.py
